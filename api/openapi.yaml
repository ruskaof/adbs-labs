openapi: 3.0.3
info:
  title: Energosbyt Lab 1
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /ping:
    get:
      summary: Check availability
      responses:
        '200': { description: Available }
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Get an owner
      responses:
        '200':
          description: Owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Owner' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Change an owner's name or phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required: [fio]
                - required: [phone]
              properties:
                fio: { type: string, minLength: 1 }
                phone: { type: string, minLength: 1 }
            example: { fio: Иванов Иван Иванович, phone: '+79111111111' }
      responses:
        '204': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /realty/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Get a property
      responses:
        '200':
          description: Property
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Realty' }
        '404': { $ref: '#/components/responses/NotFound' }
  /realty/{id}/readings:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: List current daily readings within an inclusive date range
      parameters:
        - name: date_from
          in: query
          required: true
          schema: { type: string, format: date }
          example: '2026-10-01'
        - name: date_to
          in: query
          required: true
          schema: { type: string, format: date }
          example: '2026-10-31'
      responses:
        '200':
          description: Readings and the number of rows
          content:
            application/json:
              schema:
                type: object
                required: [readings, count]
                properties:
                  readings:
                    type: array
                    items: { $ref: '#/components/schemas/Reading' }
                  count: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Submit or correct a reading
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Reading' }
            example: { user_id: 1, tariff_id: 1, gauge_id: 1, reading_date: '2026-10-01', day_kw: 1250, night_kw: 300 }
      responses:
        '201': { description: Reading saved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /realty/{id}/invoices:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: List a property's invoices, newest first
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 0, default: 10 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Invoice page and total count before pagination
          content:
            application/json:
              schema:
                type: object
                required: [invoices, count]
                properties:
                  invoices:
                    type: array
                    items: { $ref: '#/components/schemas/Invoice' }
                  count: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /realty/{id}/gauges:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      summary: Install a meter and cancel the previous binding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gauge_id]
              properties:
                gauge_id: { $ref: '#/components/schemas/Id' }
            example: { gauge_id: 2 }
      responses:
        '201': { description: Meter installed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tariffs:
    get:
      summary: Get the tariff version in force on a date
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
          example: '2025-11-01'
      responses:
        '200':
          description: Tariff version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tariff' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
      example: 1
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource or tariff version not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Not found }
  schemas:
    Id:
      type: integer
      minimum: 1
      maximum: 18446744073709551615
    Timestamp:
      type: string
      description: UTC timestamp in YYYY-MM-DD HH:MM:SS format
      example: '2026-10-31 23:59:59'
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Owner:
      type: object
      required: [id, fio, phone, phone_prev]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        fio: { type: string }
        phone: { type: string }
        phone_prev: { type: string }
    Realty:
      type: object
      required: [id, address, square, type, number, rooms, floor, porch]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        address: { type: string }
        square: { type: integer, minimum: 0 }
        type: { type: string, enum: [flat, nrcp] }
        number: { type: string }
        rooms: { type: integer, minimum: 0 }
        floor: { type: integer, minimum: 0 }
        porch: { type: integer, minimum: 0 }
    Reading:
      type: object
      required: [user_id, tariff_id, gauge_id, reading_date, day_kw, night_kw]
      properties:
        user_id: { $ref: '#/components/schemas/Id' }
        tariff_id: { $ref: '#/components/schemas/Id' }
        gauge_id: { $ref: '#/components/schemas/Id' }
        reading_date: { type: string, format: date }
        day_kw: { type: integer, minimum: 0, maximum: 4294967295 }
        night_kw: { type: integer, minimum: 0, maximum: 4294967295 }
    Invoice:
      type: object
      required: [tariff_id, gauge_id, day_kw, night_kw, price, deadline, created_at]
      properties:
        tariff_id: { $ref: '#/components/schemas/Id' }
        gauge_id: { $ref: '#/components/schemas/Id' }
        day_kw: { type: integer, minimum: 0 }
        night_kw: { type: integer, minimum: 0 }
        price: { type: integer, minimum: 0, description: Amount in kopecks }
        deadline: { type: string, format: date }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    Tariff:
      type: object
      required: [id, name, price_day_kwph, price_night_kwph, valid_from, valid_to]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        price_day_kwph: { type: integer, minimum: 0 }
        price_night_kwph: { type: integer, minimum: 0 }
        valid_from: { $ref: '#/components/schemas/Timestamp' }
        valid_to: { $ref: '#/components/schemas/Timestamp' }
